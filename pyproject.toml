[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cellmodels"
version = "0.1.0"
description = "Quantitative molecular and cellular models of plant-pathogen interactions, with identifiability as assay resolution"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cellmodels*"]
